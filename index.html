<!DOCTYPE html>
<html lang="zh-CN">
  <!-- lang="zh-CN" 表示网页语言是简体中文 -->

  <head>
    <!-- head 里放「看不见的配置」，比如标题、编码、样式 -->
    <meta charset="UTF-8">
    <!-- charset="UTF-8" 让中文能正常显示，不乱码 -->
    <title>我的个人主页</title>
    <!-- title 会显示在浏览器标签页上 -->

    <style>
      /* CSS 样式都写在这里，先认识几个就好 */

      body {
        background: linear-gradient(135deg, #e0f2fe, #dbeafe);
        font-family: "微软雅黑", "PingFang SC", sans-serif;
        margin: 0;
        text-align: center;
        padding: 40px 20px;
      }

      .card {
        background: #ffffff;
        max-width: 520px;      /* 卡片最大宽度 */
        margin: 0 auto;        /* 让卡片水平居中 */
        border-radius: 20px;   /* 圆角 */
        padding: 40px 30px;    /* 内边距 */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        color: #1e3a8a;
        margin: 10px 0;
      }

      .intro {
        color: #475569;
        line-height: 1.8;
      }

      h2 {
        color: #1e3a8a;
        font-size: 20px;
        margin: 28px 0 8px;
      }

      .about-list {
        text-align: left;      /* 列表文字左对齐，更好读 */
        list-style: none;      /* 去掉默认的小黑点 */
        padding: 0;
        max-width: 320px;
        margin: 12px auto;     /* 水平居中 */
      }

      .about-list li {
        padding: 10px 0;
        border-bottom: 1px dashed #e2e8f0;  /* 每项下加虚线分隔 */
        color: #475569;
      }

      .tag {
        display: inline-block;
        background: #dbeafe;
        color: #1e40af;
        padding: 6px 14px;
        border-radius: 999px;
        margin: 4px;
        font-size: 14px;
        transition: all 0.2s ease;
      }

      .tag:hover {
        background: #3b82f6;          /* 背景变深蓝 */
        color: #ffffff;               /* 文字变白 */
        transform: translateY(-6px);  /* 向上飘 6 像素 */
        cursor: pointer;              /* 鼠标变成小手 */
      }

      a {
        color: #2563eb;
        text-decoration: none; /* 去掉下划线 */
        margin: 0 10px;
      }

      .avatar {
        width: 120px;        /* 头像宽度 */
        height: 120px;       /* 头像高度（和宽度一样 = 正方形）*/
        border-radius: 50%;  /* 变成圆形！ */
        border: 4px solid #bfdbfe;  /* 一圈浅蓝色描边 */
        margin-bottom: 16px; /* 和下面标题留点距离 */
        transition: all 0.3s ease;
      }

      .avatar:hover {
        transform: scale(1.5);              /* 放大 50% */
        border-color: #ec4899;               /* 描边变粉色 */
        box-shadow: 0 0 24px rgba(236, 72, 153, 0.6);  /* 粉色光晕 */
      }

      button {
        margin-top: 20px;
        padding: 10px 24px;
        font-size: 15px;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      button:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }

      input {
        margin: 8px;
        padding: 10px 14px;
        font-size: 15px;
        border: 2px solid #bfdbfe;
        border-radius: 10px;
        outline: none;    /* 去掉点击时的蓝框 */
      }

      #quoteText {
        color: #f59e0b;
        font-size: 18px;
        margin: 16px 0;
      }

      #todoList {
        list-style: none;
        padding: 0;
        max-width: 320px;
        margin: 12px auto;
        text-align: left;
      }

     #todoList li {
        background: oklch(87.047% 0.05516 285.181);
        margin: 6px 0;
        padding: 10px 14px;
        border-radius: 10px;
        color: lab(0.73% -0.23 -1.79);
      }

      .del-btn {
        margin: 0 0 0 12px;
        padding: 3px 10px;
        font-size: 12px;
        background: #ef4444;
      }

      .done-btn {
        margin: 0 0 0 12px;
        padding: 3px 10px;
        font-size: 12px;
        background: #10b981;
      }

      .done-btn:hover {
       background: #059669;
      }

      .del-btn:hover {
        background: #dc2626;
      }

      .edit-btn {
        margin: 0 0 0 12px;
        padding: 3px 10px;
        font-size: 12px;
        background: #f59e0b;
      }

      .edit-btn:hover {
        background: #d97706;
      }
    </style>
  </head>

  <body>
    <!-- body 里放「看得见的内容」 -->

    <div class="card">
      <!-- div 是一个「盒子」，用来装东西 -->
      <img class="avatar" src="avatar.svg" alt="我的头像">
      <h1 id="myName">你好，我是 TTTTT6</h1>
      <!-- h1 是最大的一级标题 -->

      <p class="intro">
        <!-- p 是段落 -->
        我是一名正在学习前端开发的新手，喜欢把想法变成好看的网页。
        这里是我的个人主页，未来会越来越棒的！请多多指教。
      </p>

      <h2>关于我</h2>

      <ul class="about-list">
        <li>🎓 正在学：HTML / CSS / JavaScript</li>
        <li>🌟 目标：成为一名前端工程师</li>
        <li>🏠 坐标：中国</li>
        <li>💬 一句话：热爱学习，乐于分享</li>
      </ul>

      <div>
        <!-- 用 tag 标签展示我的爱好 -->
        <span class="tag">睡觉</span>
        <span class="tag">游戏</span>
        <span class="tag">音乐</span>
        <span class="tag">编程</span>
      </div>

      <div style="margin-top: 24px;">
        <!-- 联系方式/社交链接 -->
        <a href="mailto:xxx@example.com">📧 邮箱</a>
        <a href="https://github.com/" target="_blank">🐙 GitHub</a>
      </div>

      <button onclick="sayHello()">点我打招呼</button>
      <button onclick="changeName()">改个名字</button>
      <button onclick="changeColor()">换个肤色</button>
      <div style="margin-top: 16px;">
        <input id="nameInput" type="text" placeholder="输入你的新名字">
        <button onclick="useInput()">确认改名</button>
      <p id="quoteText">点下面的按钮，抽一句摸鱼语录~</p>
      <button onclick="randomQuote()">随机摸鱼语录</button> 
      <div style="margin-top: 24px;">

        <h2>待办清单</h2>
        <input id="todoInput" type="text" placeholder="输入要做的事" onkeydown="checkEnter(event)">
        <button onclick="addTodo()">添加</button>
        <button onclick="completeAll()">全部完成</button>
        <button onclick="clearDone()">清除已完成</button>
        <p id="todoCount">未完成：0 件</p>
        <ul id="todoList"></ul>
    </div>

     <div style="margin-top: 24px;">
      <h2>倒计时器</h2>
      <input id="timerInput" type="text" placeholder="输入秒数">
      <button onclick="startTimer()">开始</button>
      <button onclick="resetTimer()">重置</button>
      <p id="timerDisplay">0 秒</p>
    </div>
  </div>          
</div>            

    <script>
      let quotes = [
        "摸鱼一时爽，一直摸鱼一直爽",
        "写代码累了，就喝口水歇一歇",
        "今天的你，也很棒哦",
        "白饭是世界上最美好的东西",
        "吃白饭的蓝色大肥鱼我爱你"
      ];
      let isGreen = false;   // 全局变量：记住当前是不是绿色
      let timerId = null;   // 定时器的“身份证”，null 表示没在计时
      let leftTime = 0;     // 还剩多少秒

      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
      renderTodo();   // 页面一打开，就把之前存的待办显示出来

      function addTodo() {
       let task = document.getElementById("todoInput").value;
      if (task === "") {
       return;
         }
      tasks.push({ text: task, done: false });
      saveTasks();
      document.getElementById("todoInput").value = "";
      renderTodo();
      }

      function checkEnter(event) {
       if (event.key === "Enter") {
         addTodo();
       }
      }

      function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
      }

      function deleteTodo(index) {
      tasks.splice(index, 1);   // 删掉数组里第 index 个
      saveTasks();
      renderTodo();             // 重新画一遍列表
      }

      function toggleDone(index) {
        tasks[index].done = !tasks[index].done;   // 完成状态取反
        saveTasks();                              // 存起来
        renderTodo();                             // 重新画一遍
      }

      function renderTodo() {
       let list = document.getElementById("todoList");
       list.innerHTML = "";   // 先清空旧列表，避免越加越多
       
       for (let i = 0; i < tasks.length; i++) {
          let item = tasks[i];            // 每一项现在是个对象

          let li = document.createElement("li");
          li.textContent = item.text;     // 显示文字

          if (item.done) {
           li.style.textDecoration = "line-through";  // 做完了就划线
         }

         let doneBtn = document.createElement("button");
         doneBtn.textContent = "完成";
         doneBtn.className = "done-btn";
         doneBtn.onclick = function () {
           toggleDone(i);
         };

         let delBtn = document.createElement("button");
         delBtn.textContent = "删除";
         delBtn.className = "del-btn";
         delBtn.onclick = function () {
           deleteTodo(i);
         };

         let editBtn = document.createElement("button");
         editBtn.textContent = "编辑";
         editBtn.className = "edit-btn";
         editBtn.onclick = function () {
           editTodo(i);
         };

         li.appendChild(doneBtn);
         li.appendChild(delBtn);
         li.appendChild(editBtn);
         list.appendChild(li);
         }
      updateCount();   // ← 新增这一行
      }

      function updateCount() {
       let active = tasks.filter(t => t.done === false);  // 只留没完成的
       document.getElementById("todoCount").innerText = "未完成：" + active.length + " 件";
      }

      function randomQuote() {
       let index = Math.floor(Math.random() * quotes.length);
       document.getElementById("quoteText").innerText = quotes[index];
      }

      function sayHello() {
        alert("你好呀！欢迎来到我的主页~");
      }

      function changeName() {
        document.getElementById("myName").innerText = "你好，我是TTTTT6！";
      }

      function changeColor() {
        if (isGreen) {
          // 现在是绿色 → 切回蓝色
          document.body.style.background = "linear-gradient(135deg, #e0f2fe, #dbeafe)";
          isGreen = false;
         } else {
          // 现在是蓝色 → 切成绿色
          document.body.style.background = "linear-gradient(135deg, #dcfce7, #bbf7d0)";
          isGreen = true;
         }
      }

      function editTodo(index) {
       let newText = prompt("修改这条待办：", tasks[index].text);
       if (newText !== null && newText !== "") {
         tasks[index].text = newText;   // 更新内容
         saveTasks();                   // 存起来
         renderTodo();                  // 重新画一遍
         }
      }

      function useInput() {
        let newName = document.getElementById("nameInput").value;
        document.getElementById("myName").innerText = "你好，我是" + newName;
        document.getElementById("nameInput").value = "";
      }

      function clearDone() {
       tasks = tasks.filter(t => t.done === false);   // 只留没完成的
       saveTasks();
       renderTodo();
      }

      function completeAll() {
       tasks.forEach(t => {
          t.done = true;
       });
       saveTasks();
       renderTodo();
      }

      function startTimer() {
       let seconds = Number(document.getElementById("timerInput").value);  // 字符串转数字

       if (timerId !== null) {
         clearInterval(timerId);   // 如果已经在计时，先停掉旧的
        }

       if (isNaN(seconds) || seconds <= 0) {   // 不是数字或不是正数
         document.getElementById("timerDisplay").innerText = "请输入一个正数";
         return;
        }

       leftTime = seconds;
       document.getElementById("timerDisplay").innerText = leftTime + " 秒";

       timerId = setInterval(() => {
         leftTime = leftTime - 1;                                    // 每秒减 1
         document.getElementById("timerDisplay").innerText = leftTime + " 秒";

       if (leftTime <= 0) {
         clearInterval(timerId);   // 时间到，停下定时器
         timerId = null;           // 清空身份证（重要！否则下次判断会出错）
         document.getElementById("timerDisplay").innerText = "时间到！";
        }
      }, 1000);
    }

      function resetTimer() {
        if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
        }
        leftTime = 0;
        document.getElementById("timerDisplay").innerText = "0 秒";
        document.getElementById("timerInput").value = "";
    }
    </script>
  </body>
</html>
