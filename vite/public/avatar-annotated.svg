<!-- ============ 这是"鲸鱼娘"头像的 SVG 矢量图 ============ -->
<!-- SVG 是用文字描述"怎么画"的图片格式：浏览器按指令一笔笔画出鲸鱼，
     所以放大缩小都不会糊（它存的是画法，不是像素点） -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- ↑ <svg> 是整张图的根标签，就像 HTML 里的 <html>
   xmlns：声明这是标准 SVG 命名空间（固定写法，照抄即可）
   viewBox="0 0 200 200"：画布坐标系——左上角是 (0,0)，往右 x 变大、往下 y 变大，
                          整张画布 200×200，所有图形都按这个坐标来定位 -->

  <defs>
  <!-- ↑ <defs>：定义区，里面放"备用工具"（渐变、滤镜等）
       defs 里的东西本身不显示，只有被别处引用时才生效 -->

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <!-- ↑ 定义一个"线性渐变"，取名叫 bg（给背景用）
         渐变方向：x1/y1 是起点、x2/y2 是终点；0=顶、1=底，所以是从上到下渐变 -->

      <stop offset="0" stop-color="#e0f2fe"/>
      <!-- ↑ 渐变第一个颜色节点：offset="0" 表示最顶部，颜色浅蓝 #e0f2fe -->

      <stop offset="1" stop-color="#7cc0ff"/>
      <!-- ↑ 渐变第二个颜色节点：offset="1" 表示最底部，颜色 #7cc0ff
           两个 stop 之间浏览器会自动平滑过渡 -->
    </linearGradient>

    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
    <!-- ↑ 再定义一个渐变，id 叫 bodyG，给身体用，同样从上到下 -->

      <stop offset="0" stop-color="#5ba8f9"/>
      <!-- ↑ 身体顶部用较亮的蓝 #5ba8f9 -->

      <stop offset="1" stop-color="#2563eb"/>
      <!-- ↑ 身体底部用较深的蓝 #2563eb，形成立体感 -->
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <!-- ↑ 画一个圆当底板：
       cx/cy 是圆心 (100,100)，正好在画布正中央
       r 是半径 98（几乎撑满 200 的画布）
       fill="url(#bg)"：填充色引用上面定义好的渐变 bg -->

  <!-- 喷水 -->
  <g stroke="#60a5fa" stroke-width="6" stroke-linecap="round" fill="none">
  <!-- ↑ <g> 是"分组"标签，把下面三条喷水线打包成一组，统一设置样式：
       stroke（描边/线条颜色）#60a5fa、stroke-width（粗细）6、
       stroke-linecap="round"（线端圆头）、fill="none"（不填充） -->

    <path d="M86 46c-4-14-11-20-18-22"/>
    <!-- ↑ 左边那条喷水线。d 是"画线指令"：
         M86 46 = 把笔移到起点 (86,46)
         c = 三次贝塞尔曲线（c 后三组数字是控制点，决定弯曲方向），画一条向左上飞溅的水柱 -->

    <path d="M100 44c0-16-1-23-2-30"/>
    <!-- ↑ 中间那条喷水线：从 (100,44) 往上喷，最高最直 -->

    <path d="M114 46c4-14 11-20 18-22"/>
    <!-- ↑ 右边那条喷水线，和左边对称，往右上方飞溅 -->
  </g>

  <circle cx="80" cy="16" r="3" fill="#93c5fd"/>
  <circle cx="98" cy="10" r="3" fill="#93c5fd"/>
  <circle cx="120" cy="16" r="3" fill="#93c5fd"/>
  <!-- ↑ 三个小圆点，是喷到天上的小水珠，颜色 #93c5fd -->

  <!-- 尾巴 -->
  <path d="M153 118c24-8 27 14 7 22z" fill="#2563eb"/>
  <!-- ↑ 鲸鱼右边的尾巴：
       M153 118 起点，画曲线，最后的 z 表示"闭合"（把首尾连起来），形成一个分叉尾鳍 -->

  <!-- 身体 -->
  <ellipse cx="100" cy="132" rx="72" ry="56" fill="url(#bodyG)"/>
  <!-- ↑ 身体用"椭圆" ellipse：
       rx 水平半径 72、ry 垂直半径 56（横躺的椭圆，像鲸鱼胖乎乎的身体）
       fill 用 bodyG 渐变填充 -->

  <!-- 两片胸鳍 -->
  <path d="M30 122c-16-4-18 16-2 20z" fill="#2563eb"/>
  <!-- ↑ 左边胸鳍：从身体左侧伸出来的小鳍 -->

  <path d="M170 122c16-4 18 16 2 20z" fill="#2563eb"/>
  <!-- ↑ 右边胸鳍：和左边对称 -->

  <!-- 肚皮 -->
  <ellipse cx="100" cy="149" rx="48" ry="31" fill="#bfdbfe"/>
  <!-- ↑ 肚皮：一个更小的椭圆，浅蓝 #bfdbfe，盖在身体下半部分，做出"白肚皮"效果 -->

  <!-- 眼睛 -->
  <circle cx="75" cy="115" r="8" fill="#1e3a8a"/>
  <circle cx="125" cy="115" r="8" fill="#1e3a8a"/>
  <!-- ↑ 两只眼睛：两个大圆，深蓝 #1e3a8a，一左一右对称 -->

  <circle cx="78" cy="112" r="2.6" fill="#fff"/>
  <circle cx="128" cy="112" r="2.6" fill="#fff"/>
  <!-- ↑ 眼睛里的小白点（高光）：白色，让眼睛水汪汪有神 -->

  <!-- 腮红 -->
  <ellipse cx="59" cy="131" rx="9" ry="6" fill="#f9a8d4" opacity="0.8"/>
  <ellipse cx="141" cy="131" rx="9" ry="6" fill="#f9a8d4" opacity="0.8"/>
  <!-- ↑ 两坨粉色腮红：fill 粉色 #f9a8d4，opacity="0.8" 表示 80% 不透明（半透明更自然） -->

  <!-- 微笑 -->
  <path d="M87 138q13 10 26 0" stroke="#1e3a8a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- ↑ 微笑的嘴巴：
       只描边不填充（fill="none"），stroke-width 是线条粗细
       q13 10 26 0 用"二次贝塞尔"画一道上扬的弧线，就是鲸鱼甜甜的笑容 -->
</svg>